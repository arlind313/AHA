<style>

  :root { --red: #E30613; }
  html, body { margin: 0; background: #000; color: #fff; font-family: Montserrat, sans-serif; overflow: hidden; }
  #wrap { position: relative; margin: 0 auto; width: 1080px; height: 1920px; }
  #stage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; transform-origin: 0 0; background: #02040a; }
  #gl { position: absolute; inset: 0; width: 1080px; height: 1920px; }
  .layer { position: absolute; inset: 0; pointer-events: none; }
  #vignette { background: radial-gradient(ellipse 85% 62% at 50% 48%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.55) 100%); }
  #fade { background: #000; }
  /* map pins */
  .pin { position: absolute; left: 0; top: 0; width: 64px; height: 84px; margin: -84px 0 0 -32px; transform-origin: 32px 84px; opacity: 0;
         filter: drop-shadow(0 0 10px rgba(227,6,19,.85)) drop-shadow(0 6px 10px rgba(0,0,0,.6)); will-change: transform; }
  .pin svg { width: 100%; height: 100%; }
  .maplabel { position: absolute; left: 0; top: 0; opacity: 0; white-space: nowrap; }
  .maplabel .n { font: italic 900 50px/1 Montserrat; letter-spacing: .01em; text-shadow: 0 2px 14px rgba(0,0,0,.8); }
  .maplabel .tag { display: inline-block; margin-top: 8px; padding: 5px 14px 5px 12px; background: var(--red); transform: skewX(-14deg);
                   font: italic 800 19px/1 Montserrat; letter-spacing: .05em; box-shadow: 0 0 18px rgba(227,6,19,.45); }
  .maplabel .tag span { display: inline-block; transform: skewX(14deg); }
  /* chapter title card */
  #card { position: absolute; left: 84px; top: 286px; opacity: 0; }
  #card-idx { font: 600 24px/1 Montserrat; letter-spacing: .28em; margin-bottom: 20px; color: rgba(255,255,255,.7); }
  #card-idx b { color: var(--red); font-weight: 600; margin-right: 10px; }
  #card-name { font: italic 900 136px/0.95 Montserrat; letter-spacing: -0.01em; padding-right: 30px;
               text-shadow: 0 6px 30px rgba(0,0,0,.65); }
  #card-rule { width: 150px; height: 7px; background: var(--red); margin: 26px 0 24px 6px; transform-origin: 0 50%; box-shadow: 0 0 16px rgba(227,6,19,.6); }
  #card-sub { font: 500 28px/1 Montserrat; letter-spacing: .42em; color: rgba(255,255,255,.88); text-shadow: 0 2px 12px rgba(0,0,0,.8); padding-left: 4px; }
  /* Burj silhouette */
  #burj { position: absolute; left: 0; top: 0; width: 104px; height: 520px; opacity: 0; transform-origin: 0 100%; }
  #burj svg { width: 100%; height: 100%; overflow: visible; }
  /* final reveal */
  #scrim { background: linear-gradient(180deg, rgba(2,4,10,0) 52%, rgba(2,4,10,.78) 68%, rgba(2,4,10,.9) 100%); opacity: 0; }
  #topscrim { background: linear-gradient(180deg, rgba(2,4,10,.85) 0%, rgba(2,4,10,0) 20%); opacity: 0; }
  .center { position: absolute; left: 50%; white-space: nowrap; transform: translateX(-50%); }
  #line1 { top: 1188px; font: italic 900 98px/1 Montserrat; letter-spacing: .005em; text-shadow: 0 4px 24px rgba(0,0,0,.7); opacity: 0; padding: 0 20px; }
  #line2 { top: 1298px; font: italic 900 138px/1 Montserrat; color: var(--red); opacity: 0; padding: 0 24px; }
  #logo { top: 196px; width: 760px; opacity: 0; filter: drop-shadow(0 4px 18px rgba(0,0,0,.6)); }
  #locline { top: 1478px; font: 600 30px/1 Montserrat; letter-spacing: .32em; color: rgba(255,255,255,.9); opacity: 0; padding-left: .32em; }
  #locline i { color: var(--red); font-style: normal; margin: 0 .25em; }
  /* preview chrome */
  #bar { display: none; }
  body.preview #bar { display: flex; gap: 14px; align-items: center; justify-content: center; height: 56px; font: 500 14px Montserrat; }
  #bar button { background: var(--red); color: #fff; border: 0; padding: 10px 18px; font: 600 14px Montserrat; cursor: pointer; border-radius: 4px; }
  #bar input { width: min(520px, 50vw); accent-color: var(--red); }
  #tc { width: 64px; font-variant-numeric: tabular-nums; opacity: .8; }
</style>
